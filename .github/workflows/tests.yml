name: Windows CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install baseline requirements
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Run synthetic CPU inference
        run: python evaluate.py --images examples/input --output output/ci
      - name: Check synthetic outcomes
        run: |
          python -c "import json; from pathlib import Path; r={x['file']:x for x in json.loads(Path('output/ci/results.json').read_text(encoding='utf-8'))}; assert [b['printedNumber'] for b in r['synthetic_two_columns.jpg']['page']['blocks']]==['1','2','3','4']; assert r['synthetic_continuation.jpg']['page']['blocks']==[]; assert r['synthetic_continuation.jpg']['status']=='manual_required'"
